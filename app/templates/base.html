<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · {{ business.name }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">{{ business.name }}</a>
    <nav>
      <a href="/" {% if active == "chat" %}aria-current="page"{% endif %}>Simulator</a>
      <a href="/staff" {% if active == "staff" %}aria-current="page"{% endif %}>Jobs</a>
      <a href="/staff/customers" {% if active == "customers" %}aria-current="page"{% endif %}>Customers</a>
    </nav>
    <span class="pill">{{ business.trade|title }}</span>
  </header>
  {% block body %}{% endblock %}
</body>
</html>
